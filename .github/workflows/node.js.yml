name: SOCLE Release Gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socle-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish pub socle V3
    needs: [core, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'pub socle V3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create named release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="pub-socle-v3-v${version}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "pub socle V3 ${version}" --notes-file docs/pub-socle-v3.md

  core:
    name: Core / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Verify runtime
        run: |
          node --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 22) { console.error('Node 22+ required'); process.exit(1); }"

      - name: Clean dependency install
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --package-lock=false
          else
            echo "No npm manifest on this ref; no external npm dependency install required."
          fi

      - name: Capture generated file bytes
        run: node scripts/check-build-output.mjs capture "$RUNNER_TEMP/build-output-before.json"

      - name: Build frontend + worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]] && node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          else
            node scripts/build.mjs
          fi

      - name: Check generated files byte-for-byte
        run: node scripts/check-build-output.mjs verify "$RUNNER_TEMP/build-output-before.json"

      - name: Check BatiNova XL QA syntax
        run: node --check scripts/simulation/batinova-xl/qa-report.mjs

      - name: Hermetic business tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/test.mjs ]]; then
            node scripts/test.mjs
          else
            count=0
            for test in tests/*.mjs; do
              case "$(basename "$test")" in
                browser-15.mjs|browser-identities-15.mjs|data-15.mjs) continue ;;
              esac
              echo
              echo "=== $(basename "$test") ==="
              node --experimental-sqlite "$test"
              count=$((count+1))
            done
            if [[ "$count" -eq 0 ]]; then
              echo "No hermetic business test suite was executed." >&2
              exit 1
            fi
            echo "Executed $count hermetic business test suites."
          fi

      - name: BatiNova XL pack presence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/simulation/batinova-xl/qa-report.mjs --packs-only

      - name: Prepare BatiNova XL simulation
        shell: bash
        env:
          BATXL_SIMULATION: "1"
          BATXL_ORGANIZATION_ID: "org-local-owner"
        run: |
          set -euo pipefail
          rm -rf data
          mkdir -p data
          test -s scripts/simulation/batinova-xl/fixtures/socle-batinova-script1-final-2026-09-24.sqlite
          cp scripts/simulation/batinova-xl/fixtures/socle-batinova-script1-final-2026-09-24.sqlite data/socle.sqlite
          node --experimental-sqlite scripts/simulation/batinova-xl/batinova-script3.mjs

      - name: BatiNova XL QA
        shell: bash
        run: |
          set -euo pipefail
          test -f data/socle.sqlite
          node --experimental-sqlite scripts/simulation/batinova-xl/qa-report.mjs --require-targets

  browser:
    name: Browser / Chromium
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Clean dependency install
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --package-lock=false
          fi

      - name: Capture browser build file bytes
        run: node scripts/check-build-output.mjs capture "$RUNNER_TEMP/browser-build-before.json"

      - name: Build browser candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]] && node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          else
            node scripts/build.mjs
          fi

      - name: Check browser build files byte-for-byte
        run: node scripts/check-build-output.mjs verify "$RUNNER_TEMP/browser-build-before.json"

      - name: Prepare BatiNova data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data
          mkdir -p data
          test -s scripts/simulation/batinova-xl/fixtures/socle-batinova-script1-final-2026-09-24.sqlite
          cp scripts/simulation/batinova-xl/fixtures/socle-batinova-script1-final-2026-09-24.sqlite data/socle.sqlite
          node --experimental-sqlite scripts/simulation/batinova-xl/batinova-script3.mjs

      - name: Run all browser suites and publish results
        id: browser_suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/artifacts/browser-gate
          suites=$(node scripts/browser-gate.mjs --list)
          printf '### Browser / Chromium\n\nPalier bloquant. Chaque suite tourne une fois ; une seule en echec fait echouer la CI.\n\n| Suite | Result | Exit code |\n| --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          executed=0
          for suite in $suites; do
            if node --experimental-sqlite scripts/browser-gate.mjs --runs=1 --only="$suite" 2>&1 | tee "tests/artifacts/browser-gate/${suite%.mjs}-console.log"; then
              code=0
              result=PASS
            else
              code=$?
              result=FAIL
              failed=$((failed+1))
              echo "::error title=Browser / Chromium::$suite failed (exit $code)"
            fi
            executed=$((executed+1))
            printf '| %s | %s | %s |\n' "$suite" "$result" "$code" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nSuites en echec : %s. Une seule suffit a faire echouer la CI.\n' "$failed" >> "$GITHUB_STEP_SUMMARY"
          test "$executed" -gt 0
          echo "completed=true" >> "$GITHUB_OUTPUT"
          test "$failed" -eq 0

      - name: Report browser setup failure or interruption
        if: always() && steps.browser_suites.outputs.completed != 'true'
        env:
          SUITE_OUTCOME: ${{ steps.browser_suites.outcome }}
        shell: bash
        run: |
          printf '### Browser / Chromium\n\nBrowser suites did not complete: %s (setup failure or cancellation). See any partial results above.\n' "$SUITE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Browser / Chromium::Browser suites did not complete: $SUITE_OUTCOME"

      - name: Upload browser logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socle-browser-artifacts
          path: tests/artifacts/
          if-no-files-found: ignore
